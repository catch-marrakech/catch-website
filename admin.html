<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reservations · Catch Marrakech</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--black:#0b0907;--ink:#120e0b;--b9:#1c140f;--b8:#2a1d15;--b4:#8a6a50;--gold:#e6c060;--cream:#efe4d2;--muted:#b3a38e;
    --pending:#e6c060;--confirmed:#7fcf8a;--cancelled:#e08a6e;--seated:#7fb6cf;--noshow:#9a8f86;
    --serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--black);color:var(--cream);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit}
  button,input,select{font:inherit}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 16px;background:rgba(11,9,7,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(230,192,96,.15)}
  .top img{height:26px}
  .top h1{font:500 22px var(--serif);color:var(--gold);margin-right:auto}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
  .btn{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:9px 14px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  .btn:hover{background:var(--gold);color:var(--black)}
  .btn--solid{background:var(--gold);color:var(--black)}
  .btn--sm{padding:7px 10px;font-size:11px;letter-spacing:.1em}
  .ghost{border-color:rgba(230,192,96,.3);color:var(--muted)}
  /* login */
  .login{max-width:360px;margin:12vh auto 0;padding:32px 24px;border:1px solid rgba(230,192,96,.25);background:var(--ink);text-align:center}
  .login img{width:180px;margin:0 auto 24px;display:block}
  .login input{width:100%;margin:8px 0 14px;padding:12px;background:var(--black);border:1px solid rgba(230,192,96,.25);color:var(--cream)}
  .login .btn{width:100%}
  .err{color:var(--cancelled);font-size:13px;min-height:20px;margin-top:10px}
  /* controls */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
  .tabs button.on{background:var(--gold);color:var(--black)}
  .tabs input{background:var(--ink);border:1px solid rgba(230,192,96,.25);color:var(--cream);padding:7px 10px}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(.6)}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .stat{border:1px solid rgba(230,192,96,.18);background:var(--ink);padding:10px 14px;min-width:110px}
  .stat b{display:block;font:500 26px var(--serif);color:var(--gold)}
  .stat small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  /* list */
  .day{margin-top:26px}
  .day h2{font:500 24px var(--serif);color:var(--gold);border-bottom:1px solid rgba(230,192,96,.15);padding-bottom:6px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
  .day h2 small{font:500 12px var(--sans);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .res{display:grid;grid-template-columns:64px 1fr auto;gap:6px 16px;padding:14px;border:1px solid rgba(230,192,96,.12);background:var(--b9);margin-bottom:8px;border-left:3px solid var(--c,var(--pending))}
  .res.cancelled,.res.no-show{opacity:.55}
  .res .t{font:500 24px var(--serif);color:var(--cream)}
  .res .g{font-size:12px;color:var(--muted)}
  .res .who b{font-weight:600}
  .res .who div{font-size:13px;color:var(--muted);word-break:break-word}
  .res .who a{color:var(--cream)}
  .res .notes{margin-top:6px;font-size:13px;color:var(--cream);background:rgba(230,192,96,.06);padding:6px 8px;border-left:2px solid rgba(230,192,96,.3)}
  .badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--c);color:var(--c);margin-left:8px;vertical-align:2px}
  .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .acts select{background:var(--ink);color:var(--cream);border:1px solid rgba(230,192,96,.25);padding:6px 8px}
  .empty{color:var(--muted);text-align:center;padding:50px 10px;border:1px dashed rgba(230,192,96,.2)}
  .pending{--c:var(--pending)} .confirmed{--c:var(--confirmed)} .cancelled{--c:var(--cancelled)} .seated{--c:var(--seated)} .no-show{--c:var(--noshow)}
  .hidden{display:none!important}
  @media (max-width:600px){
    .res{grid-template-columns:54px 1fr}
    .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
    .acts > *{flex:1}
  }
</style>
</head>
<body>

<div id="login" class="login">
  <img src="logo-sm.png" alt="Catch Marrakech">
  <form id="login-form">
    <label for="pw" style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)">Staff password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn--solid" type="submit">Open reservations</button>
    <p class="err" id="login-err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <img src="icon.png" alt="">
    <h1>Reservations</h1>
    <button class="btn btn--sm ghost" id="refresh" title="Refresh">Refresh</button>
    <button class="btn btn--sm ghost" id="logout">Log out</button>
  </header>
  <div class="wrap">
    <div class="tabs" id="tabs">
      <button class="btn btn--sm" data-r="today">Tonight</button>
      <button class="btn btn--sm" data-r="tomorrow">Tomorrow</button>
      <button class="btn btn--sm" data-r="upcoming">Next 30 days</button>
      <button class="btn btn--sm" data-r="past">Past 7 days</button>
      <input type="date" id="pick" title="Pick a date">
    </div>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const KEY = 'catch-admin';
let pass = '';
try { pass = sessionStorage.getItem(KEY) || ''; } catch (e) {}
let range = 'today', today = null, lastItems = [];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const niceDate = (iso) => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'});
const sortKey = (r) => r.date + (r.time < '06:00' ? '2' : '1') + r.time;
function waNumber(phone) {
  let d = String(phone).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0') && d.length === 10) d = '212' + d.slice(1); // Moroccan local number
  return d;
}

async function api(method, qs, body) {
  const r = await fetch('/api/admin' + (qs || ''), {
    method, headers: {'x-admin-key': pass, 'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined, cache: 'no-store'
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error('Wrong password.'); }
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}

function rangeParams() {
  const t = today || new Date().toISOString().slice(0,10);
  if (range === 'today') return [t, t];
  if (range === 'tomorrow') return [addDays(t,1), addDays(t,1)];
  if (range === 'upcoming') return [t, addDays(t,30)];
  if (range === 'past') return [addDays(t,-7), addDays(t,-1)];
  return [range, range]; // a specific date
}

async function load() {
  const [from, to] = rangeParams();
  $('#list').innerHTML = '<p class="empty">Loading…</p>';
  try {
    const j = await api('GET', `?from=${from}&to=${to}`);
    if (!today) { today = j.today; if (range !== 'today') return load(); }
    lastItems = j.items;
    render();
  } catch (e) {
    $('#list').innerHTML = `<p class="empty">${esc(e.message)}</p>`;
  }
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.r === range));
  const items = [...lastItems].sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
  const active = items.filter(r => r.status !== 'cancelled' && r.status !== 'no-show');
  $('#stats').innerHTML = [
    ['Bookings', active.length],
    ['Guests', active.reduce((s,r) => s + Number(r.guests), 0)],
    ['To confirm', items.filter(r => r.status === 'pending').length],
  ].map(([l,v]) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');

  if (!items.length) { $('#list').innerHTML = '<p class="empty">No reservations for this period.</p>'; return; }
  const byDay = {};
  items.forEach(r => (byDay[r.date] ||= []).push(r));
  $('#list').innerHTML = Object.entries(byDay).map(([d, rs]) => {
    const g = rs.filter(r => r.status !== 'cancelled' && r.status !== 'no-show').reduce((s,r) => s + Number(r.guests), 0);
    return `<div class="day"><h2>${esc(niceDate(d))}${d === today ? ' · tonight' : ''}<small>${g} guests</small></h2>` +
      rs.map(card).join('') + '</div>';
  }).join('');
}

function card(r) {
  const wa = waNumber(r.phone);
  const msg = encodeURIComponent(`Hello ${r.name}, your table at Catch Marrakech for ${r.guests} on ${niceDate(r.date)} at ${r.time} is confirmed. See you soon! (Ref ${r.ref})`);
  return `<div class="res ${esc(r.status)}">
    <div><div class="t">${esc(r.time)}</div><div class="g">${esc(r.guests)} ${r.guests == 1 ? 'guest' : 'guests'}</div></div>
    <div class="who">
      <b>${esc(r.name)}</b><span class="badge ${esc(r.status)}">${esc(r.status)}</span>
      <div><a href="tel:${esc(r.phone.replace(/[^\d+]/g,''))}">${esc(r.phone)}</a>${r.email ? ` · <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : ''}</div>
      <div>Ref ${esc(r.ref)} · booked ${esc(new Date(r.createdAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</div>
      ${r.notes ? `<div class="notes">${esc(r.notes)}</div>` : ''}
    </div>
    <div class="acts">
      ${r.status === 'pending' ? `<button class="btn btn--sm btn--solid" data-ref="${esc(r.ref)}" data-set="confirmed">Confirm</button>` : ''}
      <a class="btn btn--sm" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${msg}">WhatsApp</a>
      <select data-ref="${esc(r.ref)}" aria-label="Status">
        ${['pending','confirmed','seated','cancelled','no-show'].map(s => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </div>
  </div>`;
}

async function setStatus(ref, status) {
  try {
    const j = await api('POST', '', {ref, status});
    lastItems = lastItems.map(r => r.ref === ref ? j.item : r);
    render();
  } catch (e) { alert(e.message); }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-set]');
  if (b) setStatus(b.dataset.ref, b.dataset.set);
  const t = e.target.closest('#tabs button');
  if (t) { range = t.dataset.r; $('#pick').value = ''; load(); }
});
document.addEventListener('change', (e) => {
  if (e.target.matches('select[data-ref]')) setStatus(e.target.dataset.ref, e.target.value);
  if (e.target.id === 'pick' && e.target.value) { range = e.target.value; load(); }
});
$('#refresh').onclick = load;
$('#logout').onclick = logout;

function logout() {
  pass = ''; try { sessionStorage.removeItem(KEY); } catch (e) {}
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
}
async function enter() {
  try {
    const j = await api('GET', '?from=2000-01-01&to=2000-01-01');
    today = j.today;
    try { sessionStorage.setItem(KEY, pass); } catch (e) {}
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    load();
  } catch (e) {
    $('#login-err').textContent = e.message;
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden');
  }
}
$('#login-form').onsubmit = (e) => { e.preventDefault(); pass = $('#pw').value; $('#login-err').textContent = ''; enter(); };
if (pass) enter();
// auto-refresh every 2 minutes while open
setInterval(() => { if (pass && !document.hidden) load(); }, 120000);
</script>
</body>
</html>
