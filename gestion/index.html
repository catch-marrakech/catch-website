<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0907">
<title>Catch Gestion</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0907; --panel: #15100c; --panel-2: #1d1611; --panel-3: #2a1f17;
    --gold: #e6c060; --gold-soft: #f0d58c; --gold-dim: rgba(230,192,96,.13);
    --text: #efe4d2; --muted: #a8987f; --line: rgba(230,192,96,.2); --line-2: rgba(239,228,210,.08);
    --good: #7fcf8a; --bad: #e08a6e; --warn: #e9b949;
    --c-cash: #e6c060; --c-tpe: #8fb3d9; --c-bk: #c79fd9; --c-cost: #b8775a;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; }
  body { font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num, td.n, .kpi b { font-variant-numeric: tabular-nums; }
  a { color: var(--gold); }
  [hidden] { display: none !important; }

  header.top { position: sticky; top: 0; z-index: 20; background: rgba(11,9,7,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 28px; width: auto; }
  .brand span { font-size: .66rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); border-left: 1px solid var(--line); padding-left: 10px; }
  .month { margin-left: auto; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 3px; }
  .month button { background: none; border: 0; color: var(--gold); width: 36px; height: 34px; cursor: pointer; font-size: 1.1rem; }
  .month button:hover { background: var(--gold-dim); }
  .month strong { min-width: 140px; text-align: center; font-weight: 600; text-transform: capitalize; font-size: .9rem; }
  nav.tabs { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 12px 11px; font-size: .76rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.on { color: var(--gold); border-bottom-color: var(--gold); }
  @media (max-width: 600px) { .month { margin-left: 0; width: 100%; justify-content: space-between; order: 3; } }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 90px; }
  h1 { font-family: var(--serif); font-weight: 700; font-size: 2.1rem; margin: 0 0 2px; line-height: 1.1; }
  h2 { font-family: var(--serif); font-weight: 700; font-size: 1.4rem; margin: 0 0 12px; color: var(--gold); }
  h3 { margin: 0; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 1fr 1fr 1fr; }
  .g-side { grid-template-columns: minmax(0, 370px) minmax(0, 1fr); align-items: start; }
  @media (max-width: 900px) { .g2, .g3, .g-side { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line-2); border-radius: 4px; padding: 18px; min-width: 0; }
  .panel.hl { border-color: var(--line); }
  .mt { margin-top: 14px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line-2); border-radius: 4px; padding: 14px 16px; min-width: 0; }
  .kpi small { display: block; color: var(--muted); font-size: .66rem; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; }
  .kpi b { display: block; font-size: 1.5rem; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi em { font-style: normal; font-size: .74rem; color: var(--muted); display: block; }
  .kpi.pos b { color: var(--good); } .kpi.neg b { color: var(--bad); } .kpi.gold b { color: var(--gold); } .kpi.bk b { color: var(--c-bk); }

  form.f { display: grid; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .row3 { grid-template-columns: 1fr 1fr; } }
  label.fl { display: grid; gap: 4px; font-size: .66rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 700; min-width: 0; }
  input, select, textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 10px 11px; font-size: .92rem; min-width: 0; }
  label.fl input, label.fl select, label.fl textarea { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text); }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  input[type=date]::-webkit-calendar-picker-indicator, input[type=month]::-webkit-calendar-picker-indicator { filter: invert(.8) sepia(.6); }
  textarea { resize: vertical; min-height: 54px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--gold); background: var(--gold); color: #0b0907; padding: 10px 16px; border-radius: 3px; font-weight: 700; font-size: .78rem; letter-spacing: .6px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--gold-soft); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.line { background: transparent; color: var(--gold); }
  .btn.line:hover { background: var(--gold-dim); }
  .btn.sm { padding: 6px 10px; font-size: .7rem; }
  .btn.ghost { background: none; border-color: var(--line-2); color: var(--muted); }
  .btn.ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn.danger { background: none; border-color: rgba(224,138,110,.5); color: var(--bad); }
  .msg { font-size: .8rem; min-height: 1.2em; margin: 0; }
  .msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
  .drop { border: 1px dashed var(--gold); border-radius: 4px; padding: 14px; text-align: center; color: var(--muted); cursor: pointer; background: var(--gold-dim); font-size: .84rem; display: block; }
  .drop b { color: var(--gold); display: block; font-size: .9rem; margin-bottom: 2px; }
  .drop input { display: none; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar input, .toolbar select { width: auto; flex: 1 1 160px; padding: 8px 10px; font-size: .85rem; }
  .toolbar .count { color: var(--muted); font-size: .78rem; margin-left: auto; }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th { text-align: left; font-size: .64rem; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 700; color: var(--gold); border-bottom: 0; border-top: 1px solid var(--line); }
  tr.cur td { background: var(--gold-dim); }
  .muted { color: var(--muted); }
  .small { font-size: .76rem; }
  .empty { color: var(--muted); text-align: center; padding: 26px 10px; font-size: .88rem; }
  .pill { display: inline-block; font-size: .64rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .pill.open { background: rgba(233,185,73,.15); color: var(--warn); }
  .pill.done { background: rgba(127,207,138,.15); color: var(--good); }
  .pill.cat { background: var(--panel-3); color: var(--text); font-weight: 600; text-transform: none; letter-spacing: 0; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
  .confirm { display: inline-flex; gap: 6px; align-items: center; font-size: .78rem; color: var(--bad); }
  .inline { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .inline input, .inline select { width: auto; padding: 6px 8px; font-size: .8rem; }

  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; font-family: var(--sans); }
  .chart .grid { stroke: var(--line-2); }
  .chart .avg { stroke: var(--muted); stroke-dasharray: 4 4; }
  .s-cash { fill: var(--c-cash); } .s-tpe { fill: var(--c-tpe); } .s-bk { fill: var(--c-bk); } .s-cost { fill: var(--c-cost); } .s-gold { fill: var(--gold); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .74rem; margin-top: 8px; align-items: center; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .sw-cash { background: var(--c-cash); } .sw-tpe { background: var(--c-tpe); } .sw-bk { background: var(--c-bk); } .sw-cost { background: var(--c-cost); }
  .split { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--panel-3); margin: 8px 0 6px; }
  .split span { display: block; height: 100%; }
  .hbars { display: grid; gap: 8px; }
  .hbar { display: grid; grid-template-columns: minmax(80px, 140px) 1fr 96px; gap: 10px; align-items: center; font-size: .82rem; }
  .hbar .track { height: 8px; background: var(--panel-3); border-radius: 99px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--gold); }
  .hbar.bk .fill { background: var(--c-bk); }
  .hbar .v { text-align: right; font-variant-numeric: tabular-nums; }
  .hbar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .cards { display: grid; gap: 14px; }
  .worker { background: var(--panel); border: 1px solid var(--line-2); border-radius: 4px; }
  .worker-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
  .worker-head h3 { font-family: var(--serif); font-size: 1.4rem; }
  .worker-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); }
  .worker-body > div { padding: 14px 18px; min-width: 0; }
  .worker-body > div + div { border-left: 1px solid var(--line-2); }
  @media (max-width: 760px) { .worker-body { grid-template-columns: 1fr; } .worker-body > div + div { border-left: 0; border-top: 1px solid var(--line-2); } }
  .ev-add { display: grid; grid-template-columns: 1.3fr 1.2fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 12px; }
  @media (max-width: 620px) { .ev-add { grid-template-columns: 1fr 1fr; } .ev-add .btn { grid-column: span 2; } }
  .ev { display: grid; grid-template-columns: 96px 1fr auto auto; gap: 10px; align-items: center; font-size: .84rem; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
  .ev .t { font-weight: 700; }
  .ev .t.ot { color: var(--good); } .ev .t.abs { color: var(--bad); } .ev .t.adv { color: var(--warn); } .ev .t.bon { color: var(--gold); }
  .ev button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0 4px; }
  .ev button:hover { color: var(--bad); }
  .pay { display: grid; gap: 6px; font-size: .86rem; }
  .pay div { display: flex; justify-content: space-between; gap: 10px; }
  .pay .net { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; font-weight: 700; font-size: 1.05rem; color: var(--gold); }
  .pay .minus { color: var(--bad); } .pay .plus { color: var(--good); }

  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .person { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 12px; text-align: left; color: var(--text); display: grid; gap: 2px; cursor: pointer; }
  .person:hover, .person.on { border-color: var(--gold); }
  .person .nm { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; line-height: 1.1; }
  .person .left { color: var(--warn); font-weight: 700; font-variant-numeric: tabular-nums; }
  .person .left.zero { color: var(--good); }
  .person small { color: var(--muted); font-size: .72rem; }

  .notice { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 28px; text-align: center; max-width: 560px; margin: 40px auto; }
  .notice h1 { color: var(--gold); }
  .login { max-width: 400px; margin: 8vh auto 0; text-align: left; }
  .login img { height: 60px; display: block; margin: 0 auto 18px; }
  .banner { max-width: 1180px; margin: 14px auto 0; padding: 12px 16px; border: 1px solid rgba(224,138,110,.55); background: rgba(224,138,110,.12); border-radius: 4px; font-size: .86rem; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  @media (max-width: 1212px) { .banner { margin-left: 16px; margin-right: 16px; } }
  .banner b { color: var(--bad); }
  .banner code { font-size: .76rem; color: var(--muted); word-break: break-word; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 3px; font-weight: 700; font-size: .85rem; opacity: 0; pointer-events: none; transition: all .2s; z-index: 50; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .file-ic { width: 36px; height: 36px; border-radius: 3px; border: 1px solid var(--line); display: grid; place-items: center; font-size: .58rem; font-weight: 700; color: var(--gold); background: none; cursor: pointer; }
  #refreshBtn.spin { opacity: .5; }
  #refreshBtn.err { color: var(--bad); border-color: rgba(224,138,110,.5); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><img src="/logo-sm.png" alt="Catch"><span>Gestion</span></div>
    <div class="month" id="monthNav" hidden>
      <button type="button" data-act="prevMonth" aria-label="Mois précédent">‹</button>
      <strong id="mLabel"></strong>
      <button type="button" data-act="nextMonth" aria-label="Mois suivant">›</button>
    </div>
    <button type="button" class="btn ghost sm" id="refreshBtn" data-act="refresh" title="Actualiser" hidden>↻</button>
    <button type="button" class="btn ghost sm" id="logout" data-act="logout" hidden>Déconnexion</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="banner" id="banner" hidden></div>
<main id="app"><p class="empty">Chargement…</p></main>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";

  // ---------------- helpers ----------------
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var nf = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
  var nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
  function dh(v) { return nf.format(Math.round((+v || 0) * 100) / 100) + " DH"; }
  function dh0(v) { return nf0.format(Math.round(+v || 0)) + " DH"; }
  function num(v) { var n = parseFloat(String(v == null ? "" : v).replace(/[\s\u00a0\u202f]/g, "").replace(",", ".")); return isFinite(n) ? n : 0; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function norm(x) { return String(x == null ? "" : x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function hit(q, parts) { q = norm(q).trim(); if (!q) return true; var hay = norm(parts.join(" ")); return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; }); }
  function uuid() { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }); }
  // Business day in Marrakech: until 03:00 it still counts as the previous evening.
  function todayStr() {
    var p = {};
    try { new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Casablanca", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; }); }
    catch (e) { var d0 = new Date(); p = { year: d0.getFullYear(), month: pad(d0.getMonth() + 1), day: pad(d0.getDate()), hour: d0.getHours() }; }
    var ds = p.year + "-" + p.month + "-" + p.day;
    return +p.hour < 3 ? addDays(ds, -1) : ds;
  }
  function addDays(ds, n) { var d = new Date(ds + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function monthOf(ds) { return String(ds || "").slice(0, 7); }
  function daysIn(mk) { var p = mk.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }
  function monthLabel(mk) { var p = mk.split("-"); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" }); }
  function monthShort(mk) { var p = mk.split("-"); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString("fr-FR", { month: "short" }); }
  function dayLabel(ds) { var p = ds.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }); }
  function weekday(ds) { var p = ds.split("-"); return (new Date(+p[0], +p[1] - 1, +p[2]).getDay() + 6) % 7; } // 0 = lundi
  var WD = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
  function shiftMonth(mk, d) { var p = mk.split("-"); var x = new Date(+p[0], +p[1] - 1 + d, 1); return x.getFullYear() + "-" + pad(x.getMonth() + 1); }
  function defDate(mk) { var t = todayStr(); return monthOf(t) === mk ? t : mk + "-01"; }
  var toastT;
  function toast(t) { var el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove("show"); }, 2400); }

  var METHODS = ["Espèces", "Carte", "Chèque", "Virement"];
  var CATS = ["Ingrédients", "Viandes & poissons", "Fruits & légumes", "Boissons", "Emballages", "Loyer", "Électricité / Eau / Gaz", "Entretien & réparations", "Matériel", "Marketing", "Impôts & taxes", "Autre"];
  var CH = [["cash", "Cash"], ["tpe", "TPE"]];
  var EVT = { abs: "Absence (jours)", ot: "Heures sup. (h)", adv: "Avance (DH)", bon: "Prime (DH)" };
  var EVS = { abs: "Absence", ot: "Heures sup.", adv: "Avance", bon: "Prime" };
  var HOURS_PER_DAY = 8;

  // ---------------- state ----------------
  var FDEF = { sales: { scope: "month", sort: "date" }, costs: { q: "", cat: "", st: "", scope: "month" }, credits: { q: "", st: "open" } };
  var S = {
    month: monthOf(todayStr()), tab: "dash", role: "loading",
    sales: {}, costs: [], credits: [], staff: [], ev: [], paid: {},
    f: JSON.parse(JSON.stringify(FDEF)),
    confirm: null, payCost: null, payCredit: null, editStaff: null, person: null, addStaff: false,
    bk: {}
  };
  var CFG = null, sb = null, channel = null, user = null;

  var TABS = [
    { id: "dash", label: "Tableau de bord" },
    { id: "sales", label: "Ventes" },
    { id: "costs", label: "Dépenses" },
    { id: "credits", label: "Crédits" },
    { id: "staff", label: "Personnel" },
    { id: "resa", label: "Réservations" },
    { id: "stats", label: "Statistiques" }
  ];

  // ---------------- computations ----------------
  function dayV(v) { v = v || {}; var o = { cash: +v.cash || 0, tpe: +v.tpe || 0 }; o.total = o.cash + o.tpe; return o; }
  function salesRows(pred) { return Object.keys(S.sales).filter(pred).sort().map(function (d) { var v = dayV(S.sales[d]); v.date = d; v.note = S.sales[d].note || ""; return v; }); }
  function salesOfMonth(mk) { return salesRows(function (d) { return monthOf(d) === mk; }); }
  function sumSales(rows) { return rows.reduce(function (t, r) { t.cash += r.cash; t.tpe += r.tpe; t.total += r.total; return t; }, { cash: 0, tpe: 0, total: 0 }); }
  function salesSplit(mk) { return sumSales(salesOfMonth(mk)); }

  function bkAgg(items) {

        S.addStaff = false; render(); toast("Employé ajouté : " + nm);
      }
      else if (f.getAttribute("data-form") === "editStaff") {
        var wid = f.getAttribute("data-id");
        var patch = { role: $("#eRole-" + wid).value.trim() || null, phone: $("#ePhone-" + wid).value.trim() || null, salary: num($("#eSal-" + wid).value), days: Math.max(1, Math.min(31, parseInt($("#eDays-" + wid).value, 10) || 26)), ot_rate: num($("#eOt-" + wid).value), left_month: $("#eLeft-" + wid).value || null };
        await dbq(function () { return sb.from("staff").update(patch).eq("id", wid); });
        S.staff.forEach(function (x) { if (x.id === wid) Object.assign(x, patch, { role: patch.role || "", phone: patch.phone || "", left_month: patch.left_month || "" }); });
        S.editStaff = null; render(); toast("Modifications enregistrées");
      }
      else if (f.getAttribute("data-form") === "ev") {
        var eid = f.getAttribute("data-id"), et = $("#evT-" + eid).value, dt = $("#evD-" + eid).value, vv = num($("#evV-" + eid).value);
        if (!dt || vv <= 0) { toast("Entrez une date et une valeur"); return; }
        var e = { id: uuid(), worker_id: eid, type: et, date: dt, value: vv };
        await dbq(function () { return sb.from("hr_events").insert(e); });
        S.ev.push(e); $("#evV-" + eid).value = ""; render(); toast(EVS[et] + " ajouté(e)");
      }
    } catch (er) {
      var msgEl = f.querySelector(".msg"); fail(er, msgEl);
    } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
  });

  // ---------------- boot ----------------
  function onSession(session) {
    if (session) {
      user = session.user;
      if (S.role !== "in") { S.role = "in"; lastSig = ""; render(); loadAll(); }
      if (!channel && sb.channel) { try { channel = sb.channel("catch-gestion").on("postgres_changes", { event: "*", schema: "public" }, reloadSoon).subscribe(); } catch (er) {} }
    } else {
      S.role = "login"; S.sales = {}; S.costs = []; S.credits = []; S.staff = []; S.ev = []; S.paid = {}; S.bk = {}; lastSig = ""; user = null;
      if (channel) { try { sb.removeChannel(channel); } catch (er) {} channel = null; }
      render();
    }
  }
  async function boot() {
    try { CFG = await (await fetch("/gestion/config.json", { cache: "no-store" })).json(); } catch (e) { CFG = null; }
    if (!CFG || !CFG.supabaseUrl || !CFG.supabaseKey || /PLACEHOLDER/.test(CFG.supabaseUrl + CFG.supabaseKey)) { S.role = "nocfg"; render(); return; }
    if (!window.supabase || !window.supabase.createClient) { $("#app").innerHTML = '<div class="notice"><h1>Connexion impossible</h1><p class="muted">Vérifiez votre connexion internet et rechargez la page.</p></div>'; return; }
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "catch-gestion-auth" } });
    var r = await sb.auth.getSession(); onSession(r.data && r.data.session);
    sb.auth.onAuthStateChange(function (_e, session) { onSession(session); });
  }
  window.__catchGestion = { S: S, render: render };
  boot();
})();
</script>
</body>
</html>
